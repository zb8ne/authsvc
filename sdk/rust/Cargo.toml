[package]
name = "authsdk"
version = "0.1.0"
edition = "2021"
description = "Client for authsvc — local JWT verification with a cached JWKS, OAuth code exchange, and refresh."
license = "MIT"
repository = "https://github.com/zb8ne/authsvc"

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
